name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Install test deps
        run: pip install numpy matplotlib
      - name: Run tests
        run: python3 test_mlp.py
